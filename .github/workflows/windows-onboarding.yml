name: windows-onboarding

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/install.ps1"
      - "scripts/windows/**"
      - "config/browser-bridge/**"
      - ".github/workflows/windows-onboarding.yml"
  pull_request:
    paths:
      - "scripts/install.ps1"
      - "scripts/windows/**"
      - "config/browser-bridge/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors) {
              $errors += $parseErrors
            }
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell parse errors detected."
          }

      - name: Compile portable Remote GROWTH Python
        shell: powershell
        run: |
          Get-ChildItem .\runtime\remote-growth-stable -Filter *.py -Recurse | ForEach-Object {
            python -m py_compile $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Runtime installer dry run
        shell: powershell
        run: |
          .\scripts\windows\remote-growth-stable\install-runtime.ps1 -SourceRuntimeRoot .\runtime\remote-growth-stable -TailscaleDnsName example-device.example.ts.net -DryRun

      - name: Installer dry run
        shell: powershell
        run: |
          .\scripts\install.ps1 -DryRun -NoOpenSetupPages

      - name: Install into ephemeral runner
        shell: powershell
        run: |
          .\scripts\install.ps1 -NoOpenSetupPages

      - name: Verify generated launchers
        shell: powershell
        run: |
          $desktop = [Environment]::GetFolderPath("Desktop")
          $folder = Join-Path $desktop "OTAK-ATIK"
          if (-not (Test-Path $folder)) {
            throw "OTAK-ATIK Desktop launcher folder was not created."
          }

          $expected = @(
            "START.cmd",
            "README.txt",
            "ADVANCED\START REMOTE DESKTOP.bat",
            "ADVANCED\LEGACY STATUS.bat"
          )

          foreach ($name in $expected) {
            $path = Join-Path $folder $name
            if (-not (Test-Path $path)) {
              throw "Missing generated launcher: $path"
            }
          }

          $old = Join-Path $folder "01 - START REMOTE DESKTOP.bat"
          if (Test-Path $old) {
            throw "Legacy launcher leaked back into the primary user surface: $old"
          }

          $guidedRoot = Join-Path $env:LOCALAPPDATA "otak-atik"
          $runtimeSource = Join-Path $guidedRoot "runtime-source\remote-growth-stable\MCP_GATEWAY\gateway.py"
          if (-not (Test-Path $runtimeSource)) {
            throw "Portable runtime source was not cached for repo-independent setup: $runtimeSource"
          }

          $nestedHelper = Join-Path $HOME ".otak-atik\windows\remote-growth-stable\install-runtime.ps1"
          if (-not (Test-Path $nestedHelper)) {
            throw "Nested Remote GROWTH installer helper was not copied: $nestedHelper"
          }

      - name: Wizard non-interactive dry run
        shell: powershell
        run: |
          .\scripts\windows\setup-wizard.ps1 -DryRun -NonInteractive -NoClear -SourceRoot $PWD

      - name: CLI doctor
        shell: powershell
        run: |
          otak-atik doctor
