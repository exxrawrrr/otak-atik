name: windows-onboarding

on:
  push:
    branches: ["main"]
    paths:
      - "START.cmd"
      - "STATUS.cmd"
      - "REPAIR.cmd"
      - "scripts/install.ps1"
      - "scripts/windows/**"
      - "runtime/remote-growth-stable/**"
      - "config/browser-bridge/**"
      - ".github/workflows/windows-onboarding.yml"
  pull_request:
    paths:
      - "START.cmd"
      - "STATUS.cmd"
      - "REPAIR.cmd"
      - "scripts/install.ps1"
      - "scripts/windows/**"
      - "runtime/remote-growth-stable/**"
      - "config/browser-bridge/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors) {
              $errors += $parseErrors
            }
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell parse errors detected."
          }

      - name: Compile portable Remote GROWTH Python
        shell: powershell
        run: |
          Get-ChildItem .\runtime\remote-growth-stable -Filter *.py -Recurse | ForEach-Object {
            python -m py_compile $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Reject machine-specific runtime data
        shell: powershell
        run: |
          $patterns = @('D:\RAFDI_DATA','C:\Users\User','tail39bf37')
          $findings = @()
          Get-ChildItem .\runtime\remote-growth-stable -File -Recurse | ForEach-Object {
            $path = $_.FullName
            foreach ($pattern in $patterns) {
              $match = Select-String -LiteralPath $path -Pattern $pattern -SimpleMatch -ErrorAction SilentlyContinue
              if ($match) { $findings += $match }
            }
          }
          if ($findings.Count -gt 0) {
            $findings | Format-Table Path,LineNumber,Line -AutoSize
            throw "Portable runtime contains machine-specific data."
          }

      - name: Runtime installer dry run
        shell: powershell
        run: |
          .\scripts\windows\remote-growth-stable\install-runtime.ps1 -SourceRuntimeRoot .\runtime\remote-growth-stable -TailscaleDnsName example-device.example.ts.net -DryRun

      - name: Setup Python for portable runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv for portable runtime test
        shell: powershell
        run: |
          python -m pip install uv

      - name: Fresh portable runtime acceptance
        shell: powershell
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "otak-atik-remote-growth"
          .\scripts\windows\remote-growth-stable\install-runtime.ps1 `
            -SourceRuntimeRoot .\runtime\remote-growth-stable `
            -InstallRoot $runtime `
            -GatewayPort 19765 `
            -UpstreamPort 19766 `
            -TaskName "OtakAtik CHAT4 CI" `
            -SkipAutoStartTask `
            -Force
          .\scripts\windows\remote-growth-stable\test-runtime.ps1 -InstallRoot $runtime -AsJson

      - name: Status detects missing recovery task
        shell: powershell
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "otak-atik-remote-growth"
          $json = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\remote-growth-status.ps1 -InstallRoot $runtime -LocalOnly -NonInteractive -AsJson -NoClear
          $code = $LASTEXITCODE
          if ($code -ne 3) {
            throw "Expected STATUS exit 3 (REPAIR_NEEDED), got $code."
          }
          $status = $json | ConvertFrom-Json
          if ($status.overall -ne "REPAIR_NEEDED") {
            throw "Expected REPAIR_NEEDED, got $($status.overall)."
          }

      - name: Simulate stopped portable runtime
        shell: powershell
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "otak-atik-remote-growth"
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.ProcessId -ne $PID -and
              [string]$_.CommandLine -like "*$runtime*"
            } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2

      - name: Repair portable runtime acceptance
        shell: powershell
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "otak-atik-remote-growth"
          $json = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\remote-growth-repair.ps1 -InstallRoot $runtime -LocalOnly -NonInteractive -AsJson -NoClear
          if ($LASTEXITCODE -ne 0) {
            throw "REPAIR did not recover the portable runtime."
          }
          $result = $json | ConvertFrom-Json
          if (-not $result.ok -or $result.overall -ne "READY") {
            throw "REPAIR did not return READY."
          }
          if (-not $result.health.local.auth_guard_ok -or [int]$result.health.local.count -ne 64) {
            throw "REPAIR did not restore 401 guard + 64 tools."
          }

      - name: Status ready after repair
        shell: powershell
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "otak-atik-remote-growth"
          $json = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\remote-growth-status.ps1 -InstallRoot $runtime -LocalOnly -NonInteractive -AsJson -NoClear
          if ($LASTEXITCODE -ne 0) {
            throw "STATUS did not return READY after repair."
          }
          $status = $json | ConvertFrom-Json
          if (-not $status.ok -or $status.overall -ne "READY") {
            throw "STATUS did not verify READY after repair."
          }

      - name: Foreign port fail-closed acceptance
        shell: powershell
        run: |
          $conflict = Join-Path $env:RUNNER_TEMP "otak-atik-conflict"
          New-Item -ItemType Directory -Force -Path $conflict | Out-Null
          '{"gatewayPort":19965,"upstreamPort":19966,"taskName":"OtakAtik CHAT4 Conflict"}' |
            Set-Content -LiteralPath (Join-Path $conflict "config.json") -Encoding UTF8
          'ci-placeholder' |
            Set-Content -LiteralPath (Join-Path $conflict "auth.key") -Encoding ASCII

          $foreign = Start-Process python -ArgumentList @("-m","http.server","19965","--bind","127.0.0.1") -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2

            $statusJson = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\remote-growth-status.ps1 -InstallRoot $conflict -LocalOnly -NonInteractive -AsJson -NoClear
            $statusCode = $LASTEXITCODE
            $repairJson = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\remote-growth-repair.ps1 -InstallRoot $conflict -LocalOnly -NonInteractive -AsJson -NoClear
            $repairCode = $LASTEXITCODE
            $alive = [bool](Get-Process -Id $foreign.Id -ErrorAction SilentlyContinue)

            if ($statusCode -ne 5) { throw "STATUS did not block a foreign port owner." }
            if ($repairCode -ne 5) { throw "REPAIR did not fail closed on a foreign port owner." }
            if (-not $alive) { throw "REPAIR terminated a foreign process." }

            $status = $statusJson | ConvertFrom-Json
            $repair = $repairJson | ConvertFrom-Json
            if ($status.overall -ne "BLOCKED" -or $repair.overall -ne "BLOCKED") {
              throw "Foreign-port classification was not BLOCKED."
            }
          } finally {
            Stop-Process -Id $foreign.Id -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $conflict -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Cleanup portable runtime acceptance
        if: always()
        shell: powershell
        run: |
          foreach ($port in @(19765,19766)) {
            Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty OwningProcess |
              Sort-Object -Unique |
              ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
          }
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.ProcessId -ne $PID -and [string]$_.CommandLine -like '*otak-atik-remote-growth*' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Get-ScheduledTask -TaskName "OtakAtik CHAT4 CI" -ErrorAction SilentlyContinue |
            Unregister-ScheduledTask -Confirm:$false -ErrorAction SilentlyContinue

      - name: Installer dry run
        shell: powershell
        run: |
          .\scripts\install.ps1 -DryRun -NoOpenSetupPages

      - name: Install into ephemeral runner
        shell: powershell
        run: |
          .\scripts\install.ps1 -NoOpenSetupPages

      - name: Verify generated launchers
        shell: powershell
        run: |
          $desktop = [Environment]::GetFolderPath("Desktop")
          $folder = Join-Path $desktop "OTAK-ATIK"
          if (-not (Test-Path $folder)) {
            throw "OTAK-ATIK Desktop launcher folder was not created."
          }

          $expected = @(
            "START.cmd",
            "STATUS.cmd",
            "REPAIR.cmd",
            "README.txt",
            "ADVANCED\START REMOTE DESKTOP.bat",
            "ADVANCED\LEGACY STATUS.bat"
          )

          foreach ($name in $expected) {
            $path = Join-Path $folder $name
            if (-not (Test-Path $path)) {
              throw "Missing generated launcher: $path"
            }
          }

          $old = Join-Path $folder "01 - START REMOTE DESKTOP.bat"
          if (Test-Path $old) {
            throw "Legacy launcher leaked back into the primary user surface: $old"
          }

          $guidedRoot = Join-Path $env:LOCALAPPDATA "otak-atik"
          $runtimeSource = Join-Path $guidedRoot "runtime-source\remote-growth-stable\MCP_GATEWAY\gateway.py"
          if (-not (Test-Path $runtimeSource)) {
            throw "Portable runtime source was not cached for repo-independent setup: $runtimeSource"
          }

          $nestedHelper = Join-Path $HOME ".otak-atik\windows\remote-growth-stable\install-runtime.ps1"
          if (-not (Test-Path $nestedHelper)) {
            throw "Nested Remote GROWTH installer helper was not copied: $nestedHelper"
          }

      - name: Wizard non-interactive dry run
        shell: powershell
        run: |
          .\scripts\windows\setup-wizard.ps1 -DryRun -NonInteractive -NoClear -SourceRoot $PWD

      - name: CLI doctor
        shell: powershell
        run: |
          otak-atik doctor